#更多规则使用说明请参考 http://AppOpt.suto.top

#下面是骁龙8+也就是4+3+1结构的线程配置。
#理念就是把占用高的线程全给能效好的核心。
#例如8+就是4-6大核和超大核7比小核要好。
#一般改改线程就行
#直接对应程序例如`com.coolapk.market=核心`不是最优选。
#优选应该是`com.coolapk.market{线程}=核心`。
#软件一般就有的进程
#{RenderThread}
#{Binder:*} 或者 {binder:*}
#{HwBinder:*}
#游戏一般有的就是
#{UnityMain}
#{Thread-*}
#{HeapTaskDaemon}
#纯个人自用。
#非进程名称请加上"#"注释

